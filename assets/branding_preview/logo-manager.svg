<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mgrBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1a" />
      <stop offset="50%" stop-color="#0a1533" />
      <stop offset="100%" stop-color="#030610" />
    </linearGradient>

    <!-- Executive Cyan Gradient -->
    <linearGradient id="mgrCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Deep Cobalt / Royal Indigo -->
    <linearGradient id="mgrIndigoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Leadership Gold Accent -->
    <linearGradient id="mgrGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Tower Glass Gradient 1 -->
    <linearGradient id="mgrTower1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Tower Glass Gradient 2 -->
    <linearGradient id="mgrTower2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="mgrCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="mgrGoldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Icon Body -->
    <filter id="mgrDropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Radial Network Grid Pattern -->
    <pattern id="mgrNetworkPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="rgba(0, 229, 255, 0.04)" stroke-width="1" />
      <circle cx="20" cy="20" r="1.5" fill="rgba(0, 229, 255, 0.15)" />
    </pattern>
  </defs>

  <!-- Squircle Base / App Icon Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#mgrBgGrad)" stroke="rgba(0, 229, 255, 0.35)" stroke-width="3" />
  
  <!-- Subtle Internal Glow Ring -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" />
  
  <!-- Network Overlay -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#mgrNetworkPattern)" />

  <!-- Ambient Blue & Cyan Spotlights -->
  <circle cx="256" cy="240" r="180" fill="url(#mgrIndigoGrad)" opacity="0.15" filter="blur(45px)" />
  <circle cx="270" cy="210" r="100" fill="url(#mgrCyanGrad)" opacity="0.18" filter="blur(35px)" />

  <!-- Top Brand Wordmark: QazGost -->
  <g transform="translate(0, 68)">
    <text x="256" y="0" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="3" text-anchor="middle">
      <tspan fill="#ffffff">Qaz</tspan><tspan fill="#00e5ff">Gost</tspan>
    </text>
    <line x1="216" y1="9" x2="296" y2="9" stroke="url(#mgrCyanGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- MAIN SYMBOL: MANAGER Q-MONOGRAM WITH ARCHITECTURAL SKYSCRAPERS & GROWTH CURVE -->
  <g filter="url(#mgrDropShadow)">

    <!-- Executive Outer Orbital "Q" Ring -->
    <!-- Major Arc curving around the buildings -->
    <path d="M 175 145 
             A 140 140 0 1 1 350 345" 
          fill="none" 
          stroke="url(#mgrCyanGrad)" 
          stroke-width="18" 
          stroke-linecap="round" />

    <!-- Secondary Orbit (Thin Futuristic Accent Track) -->
    <path d="M 150 170 
             A 165 165 0 1 1 365 375" 
          fill="none" 
          stroke="rgba(0, 229, 255, 0.3)" 
          stroke-width="3.5" 
          stroke-dasharray="8 6" 
          stroke-linecap="round" />

    <!-- 3 ASCENDING ARCHITECTURAL SKYSCRAPERS (GROWTH & REAL ESTATE SCALE) -->
    
    <!-- Left Tower (Foundation / Scale, Medium Height) -->
    <rect x="175" y="225" width="42" height="135" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <!-- Tower Windows Rows -->
    <line x1="184" y1="240" x2="208" y2="240" stroke="rgba(0, 229, 255, 0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="184" y1="256" x2="208" y2="256" stroke="rgba(0, 229, 255, 0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="184" y1="272" x2="208" y2="272" stroke="rgba(0, 229, 255, 0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="184" y1="288" x2="208" y2="288" stroke="rgba(0, 229, 255, 0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="184" y1="304" x2="208" y2="304" stroke="rgba(0, 229, 255, 0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="184" y1="320" x2="208" y2="320" stroke="rgba(0, 229, 255, 0.4)" stroke-width="3" stroke-linecap="round" />

    <!-- Middle Tower (High-Rise Executive HQ, Tall) -->
    <rect x="235" y="165" width="46" height="195" rx="7" fill="url(#mgrIndigoGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <!-- Spire on Middle Tower -->
    <line x1="258" y1="135" x2="258" y2="165" stroke="#a5f3fc" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="258" cy="133" r="4.5" fill="#ffffff" filter="url(#mgrCyanGlow)" />
    <!-- Glass Facet Accent -->
    <path d="M 235 165 L 260 165 L 260 360 L 235 360 Z" fill="rgba(255, 255, 255, 0.12)" />

    <!-- Right Tower (Future / Landmark, Highest Pinnacle & Analytics Top) -->
    <rect x="299" y="200" width="42" height="160" rx="6" fill="url(#mgrTower2)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <!-- Facet Highlight -->
    <path d="M 299 200 L 320 200 L 320 360 L 299 360 Z" fill="rgba(255, 255, 255, 0.18)" />

    <!-- Analytics Trend Line Climbing over Towers -->
    <path d="M 160 270 
             L 205 235 
             L 260 180 
             L 325 155" 
          fill="none" 
          stroke="url(#mgrCyanGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          filter="url(#mgrCyanGlow)" />

    <!-- Nodes along Trend Line -->
    <circle cx="160" cy="270" r="5" fill="#00e5ff" />
    <circle cx="205" cy="235" r="5" fill="#00e5ff" />
    <circle cx="260" cy="180" r="5.5" fill="#a5f3fc" />
    <circle cx="325" cy="155" r="6" fill="#ffffff" filter="url(#mgrCyanGlow)" />

    <!-- The "Q" Monogram Tail: Ascending Golden Growth Arrow (Profit & Expansion) -->
    <g filter="url(#mgrGoldGlow)">
      <!-- Diagonal Stem -->
      <path d="M 320 320 
               L 410 405" 
            stroke="url(#mgrGoldGrad)" 
            stroke-width="18" 
            stroke-linecap="round" />
      <!-- Arrowhead Tip -->
      <polygon points="432,385 432,425 392,425" fill="#f59e0b" />
    </g>

    <!-- Leadership Gold Star Spark -->
    <circle cx="418" cy="412" r="4.5" fill="#ffffff" />
  </g>

  <!-- Technical Spec Badge at Bottom -->
  <g transform="translate(186, 428)">
    <rect x="0" y="0" width="140" height="28" rx="7" fill="rgba(0, 229, 255, 0.12)" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.5" />
    <text x="70" y="19" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="900" fill="#00e5ff" letter-spacing="3" text-anchor="middle">
      CRM / HQ
    </text>
  </g>
</svg>
