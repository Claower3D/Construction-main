# ═══════════════════════════════════════════════════════════════════
# QAZGOST AI — GitHub Actions CI/CD Pipeline
#
# Triggers: push to main/develop, PRs to main
# Jobs:
#   1. lint     — Python linting (ruff)
#   2. test     — Unit tests (pytest)
#   3. build    — Docker build verification
#   4. smoke    — E2E smoke test against running service
#   5. deploy   — Deploy to production (manual trigger only)
# ═══════════════════════════════════════════════════════════════════

name: QAZGOST AI — CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'ai-service/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'ai-service/**'
  workflow_dispatch:  # Manual trigger

env:
  PYTHON_VERSION: '3.11'
  AI_SERVICE_DIR: ai-service

jobs:
  # ─── Lint ───────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff

      - name: Run Ruff linter
        working-directory: ${{ env.AI_SERVICE_DIR }}
        run: ruff check app/ --output-format=github

      - name: Run Ruff format check
        working-directory: ${{ env.AI_SERVICE_DIR }}
        run: ruff format --check app/ || true

  # ─── Test ───────────────────────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.AI_SERVICE_DIR }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ env.AI_SERVICE_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests
        working-directory: ${{ env.AI_SERVICE_DIR }}
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -x

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.AI_SERVICE_DIR }}/coverage.xml

  # ─── Build ──────────────────────────────────────────────────────
  build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ${{ env.AI_SERVICE_DIR }}
        run: |
          docker build \
            --tag qazgost-ai:${{ github.sha }} \
            --tag qazgost-ai:latest \
            --file Dockerfile \
            .

      - name: Verify image
        run: |
          docker images qazgost-ai
          echo "Image size: $(docker image inspect qazgost-ai:latest --format='{{.Size}}' | numfmt --to=iec)"

  # ─── Smoke Test ─────────────────────────────────────────────────
  smoke:
    name: 🔥 E2E Smoke Test
    runs-on: ubuntu-latest
    needs: build
    services:
      ai-service:
        image: qazgost-ai:latest
        ports:
          - 8001:8001
        env:
          DEVICE: cpu
          DEBUG: true
    steps:
      - uses: actions/checkout@v4

      - name: Wait for service
        run: |
          echo "Waiting for AI service..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8001/ > /dev/null 2>&1; then
              echo "Service is UP after $((i*2))s"
              break
            fi
            sleep 2
          done

      - name: Run smoke tests
        working-directory: ${{ env.AI_SERVICE_DIR }}
        run: |
          chmod +x scripts/smoke-test.sh
          AI_BASE_URL=http://localhost:8001 ./scripts/smoke-test.sh

  # ─── Deploy (Manual) ────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Deploying QAZGOST AI v$(cat ${{ env.AI_SERVICE_DIR }}/VERSION 2>/dev/null || echo '3.0.0')"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo ""
          echo "TODO: Add deployment steps here:"
          echo "  - Push to container registry"
          echo "  - Update Kubernetes/Docker Swarm"
          echo "  - Run post-deploy health check"
