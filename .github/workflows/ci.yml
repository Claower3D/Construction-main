name: QAZGOST AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  # ── Go Backend ──
  backend:
    name: 🔧 Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 📦 Download dependencies
        run: go mod download

      - name: 🔍 Vet
        run: go vet ./...

      - name: 🏗️ Build
        run: go build -o /tmp/server ./cmd/server/

      - name: 🧪 Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: 📊 Coverage Report
        run: go tool cover -func=coverage.out

  # ── React Frontend ──
  frontend:
    name: ⚛️ React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint --if-present

      - name: 🏗️ Build
        run: npm run build

  # ── Docker Build ──
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: 🏗️ Build Backend Image
        run: docker build -t qazgost-backend:${{ github.sha }} ./go-backend

      - name: ✅ Smoke Test
        run: |
          docker run -d --name test-backend \
            -p 8080:8080 \
            -e JWT_SECRET=ci-test-secret \
            -e NODE_ENV=development \
            qazgost-backend:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080/health
          docker stop test-backend
          docker rm test-backend

  # ── Security Scan ──
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🔍 Go Vulnerability Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd go-backend && govulncheck ./...
