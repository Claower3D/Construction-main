version: "3.9"

services:
  # ── Go Backend API ──
  backend:
    build:
      context: .                       # repo root: the image also needs ai-service/app/data/price_db.json
      dockerfile: go-backend/Dockerfile
    container_name: qazgost-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATABASE_URL=postgres://qazgost:${POSTGRES_PASSWORD:-qazgost}@postgres:5432/qazgost?sslmode=disable
      - UPLOAD_DIR=/app/uploads
      - FRONTEND_URL=http://localhost:5173
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_SERVICE_URL=http://ai-service:8001
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - qazgost-net

  # ── PostgreSQL (the Go backend has no SQLite mode any more) ──
  postgres:
    image: postgres:16-alpine
    container_name: qazgost-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=qazgost
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-qazgost}
      - POSTGRES_DB=qazgost
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qazgost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qazgost-net

  # ── React Frontend (dev) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qazgost-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://backend:8080
      - VITE_AI_PROXY_TARGET=http://ai-service:8001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qazgost-net

  # ── Python AI Service (QazGost AI Engine) ──
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.cpu
    container_name: qazgost-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./ai-service/app/data:/app/app/data
      - ./ai-service/models:/app/models:ro   # defect_yolov8s_best.pt (trained defect detector)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - qazgost-net

volumes:
  pg-data:
    driver: local
  backend-uploads:
    driver: local

networks:
  qazgost-net:
    driver: bridge
