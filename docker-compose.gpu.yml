# ─────────────────────────────────────────────
# QazGost AI — Production Docker Compose (GPU)
# ─────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.gpu.yml up -d
#
# Requirements:
#   - NVIDIA GPU with CUDA 12+
#   - nvidia-container-toolkit installed
#   - Docker >= 24.0
# ─────────────────────────────────────────────

version: "3.9"

services:
  # ── Go Backend API ──
  backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    container_name: qazgost-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/app/data/qazgost.db
      - UPLOAD_DIR=/app/uploads
      - FRONTEND_URL=${FRONTEND_URL:-https://qazgost.kz}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_SERVICE_URL=http://ai-service:8001
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
      - ./ai-service/app/data:/app/ai-service/app/data:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - qazgost-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── React Frontend (production build) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qazgost-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8080
      - VITE_AI_SERVICE_URL=http://ai-service:8001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qazgost-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Python AI Service (GPU-accelerated) ──
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: qazgost-ai
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEVICE=cuda
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./ai-service/app/data:/app/data:ro
      - ai-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - qazgost-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G

  # ── NGINX Reverse Proxy (SSL + Rate Limiting) ──
  nginx:
    image: nginx:alpine
    container_name: qazgost-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - qazgost-net

  # ── Prometheus Monitoring ──
  prometheus:
    image: prom/prometheus:latest
    container_name: qazgost-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - qazgost-net

volumes:
  backend-data:
    driver: local
  backend-uploads:
    driver: local
  ai-models:
    driver: local
  prometheus-data:
    driver: local

networks:
  qazgost-net:
    driver: bridge
