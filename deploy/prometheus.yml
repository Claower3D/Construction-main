global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'qazgost-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/health'

  - job_name: 'qazgost-ai'
    static_configs:
      - targets: ['ai-service:8001']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 30s
